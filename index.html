<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍕 FoodExpress</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           GLOBAL
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #FF5A3A;
            --primary-dark: #E64A2E;
            --primary-gradient: linear-gradient(135deg, #FF5A3A, #FF2D00);
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --surface-2: #F1F3F5;
            --text: #1A1A2E;
            --text-2: #4A4A5A;
            --text-3: #8A8A9E;
            --border: #EEEEF4;
            --success: #00C853;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-lg: 24px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================
           CONTAINER
           ============================================ */
        .container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            position: relative;
            min-height: 480px;
        }

        /* ============================================
           AUTH PAGES
           ============================================ */
        .auth-page {
            display: block;
        }
        .auth-page.hidden {
            display: none;
        }

        .logo {
            text-align: center;
            font-size: 56px;
            margin-bottom: 4px;
        }
        .title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background: var(--surface-2);
        }
        .input-group input:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(255, 90, 58, 0.08);
        }
        .input-group input::placeholder {
            color: var(--text-3);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 90, 58, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 28px rgba(255, 90, 58, 0.4);
        }
        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
        }
        .btn-danger {
            background: #FF1744;
            color: white;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
            font-family: inherit;
            width: 100%;
            text-align: center;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }
        .social-login button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--surface);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .social-login button:active {
            transform: scale(0.9);
        }
        .social-login .telegram {
            color: #0088cc;
        }
        .social-login .google {
            color: #DB4437;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span {
            color: var(--text-3);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* ============================================
           MAIN APP
           ============================================ */
        #mainApp {
            display: none;
        }
        #mainApp.active {
            display: block;
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .profile-header .avatar {
            font-size: 56px;
        }
        .profile-header .name {
            font-size: 20px;
            font-weight: 900;
        }
        .profile-header .phone {
            color: var(--text-3);
            font-size: 14px;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 16px 0;
        }
        .profile-stats .stat {
            text-align: center;
        }
        .profile-stats .stat .value {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
        }
        .profile-stats .stat .label {
            font-size: 12px;
            color: var(--text-3);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .menu-item {
            background: var(--surface-2);
            border-radius: var(--radius);
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .menu-item:active {
            transform: scale(0.95);
            border-color: var(--primary);
        }
        .menu-item .emoji {
            font-size: 32px;
            display: block;
        }
        .menu-item .name {
            font-weight: 700;
            font-size: 14px;
            margin-top: 4px;
        }
        .menu-item .price {
            color: var(--primary);
            font-weight: 800;
            font-size: 14px;
        }

        /* Section Title */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 16px 0 8px;
        }

        /* ============================================
           CART FLOAT
           ============================================ */
        .cart-float {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 380px;
            background: var(--text);
            color: white;
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }
        .cart-float.show {
            display: flex;
        }
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(60px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        .cart-float .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-float .left .count {
            background: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
        }
        .cart-float .left .total {
            font-weight: 800;
            font-size: 16px;
        }
        .cart-float .checkout-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .cart-float .checkout-btn:active {
            transform: scale(0.95);
        }

        /* ============================================
           CHECKOUT SHEET
           ============================================ */
        .sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: flex-end;
            backdrop-filter: blur(8px);
        }
        .sheet-overlay.active {
            display: flex;
        }
        .sheet {
            background: var(--surface);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 20px 32px;
            animation: sheetUp 0.4s ease;
        }
        @keyframes sheetUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .sheet .handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .sheet .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .sheet .header .title {
            font-size: 20px;
            font-weight: 900;
        }
        .sheet .header .close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--surface-2);
            font-size: 18px;
            cursor: pointer;
        }
        .sheet .form-group {
            margin-bottom: 14px;
        }
        .sheet .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .sheet .form-group input,
        .sheet .form-group textarea,
        .sheet .form-group select {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background: var(--surface);
        }
        .sheet .form-group input:focus,
        .sheet .form-group textarea:focus {
            border-color: var(--primary);
        }
        .sheet .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item-row .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cart-item-row .info .emoji {
            font-size: 24px;
        }
        .cart-item-row .info .name {
            font-weight: 700;
        }
        .cart-total {
            text-align: right;
            font-weight: 900;
            font-size: 18px;
            padding: 12px 0;
            border-top: 2px solid var(--border);
            margin-top: 4px;
        }
        .cart-total span {
            color: var(--primary);
        }
        .btn-checkout {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(255, 90, 58, 0.3);
            transition: all 0.2s;
        }
        .btn-checkout:active {
            transform: scale(0.97);
        }

        /* ============================================
           TAB BAR
           ============================================ */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: none;
            justify-content: space-around;
            padding: 8px 0 16px;
            border-top: 1px solid var(--border);
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
        }
        .tab-bar.active {
            display: flex;
        }
        .tab-bar .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 16px;
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-bar .tab-btn .icon {
            font-size: 22px;
            transition: all 0.2s;
        }
        .tab-bar .tab-btn.active {
            color: var(--primary);
        }
        .tab-bar .tab-btn.active .icon {
            transform: translateY(-2px);
        }

        /* ============================================
           TOAST / ALERT
           ============================================ */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: var(--radius);
            color: white;
            font-weight: 700;
            font-size: 14px;
            z-index: 9999;
            display: none;
            animation: slideDown 0.3s ease;
            max-width: calc(100% - 40px);
            text-align: center;
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: #FF1744;
        }
        .toast.info {
            background: var(--text);
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 400px) {
            .container {
                padding: 24px 16px;
            }
            .menu-grid {
                gap: 10px;
            }
            .menu-item {
                padding: 12px 8px;
            }
            .menu-item .emoji {
                font-size: 28px;
            }
            .profile-stats {
                gap: 20px;
            }
        }

        @media (min-width: 600px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ============================================
           ORDERS PAGE
           ============================================ */
        .order-card {
            background: var(--surface-2);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-card .top .order-id {
            font-weight: 700;
        }
        .order-card .top .status {
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-new {
            background: #FFF0E0;
            color: var(--primary);
        }
        .status-delivering {
            background: #E3F2FD;
            color: #0D47A1;
        }
        .status-delivered {
            background: #E8F5E9;
            color: var(--success);
        }
        .order-card .items {
            margin: 6px 0;
            font-size: 14px;
            color: var(--text-2);
        }
        .order-card .bottom {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .order-card .bottom .total {
            font-weight: 800;
        }
        .order-card .bottom .date {
            color: var(--text-3);
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .empty-state .title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }

        /* Pages */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    TOAST
    ========================================== -->
    <div class="toast" id="toast"></div>

    <!-- ==========================================
    CONTAINER
    ========================================== -->
    <div class="container">

        <!-- ==========================================
        AUTH: LOGIN
        ========================================== -->
        <div class="auth-page" id="loginPage">
            <div class="logo">🍕</div>
            <div class="title">FoodExpress</div>
            <div class="subtitle">Onlayn restoran yetkazib berish</div>

            <div class="input-group">
                <label>Ism</label>
                <input type="text" id="loginName" placeholder="Ismingiz" autocomplete="name">
            </div>
            <div class="input-group">
                <label>Telefon</label>
                <input type="tel" id="loginPhone" placeholder="+998 90 123 45 67" autocomplete="tel">
            </div>

            <button class="btn btn-primary" onclick="handleLogin()">Kirish</button>

            <div class="divider">
                <span>yoki</span>
            </div>

            <div class="social-login">
                <button class="telegram" onclick="loginWithTelegram()"><i class="fab fa-telegram-plane"></i></button>
                <button class="google" onclick="showToast('Google orqali kirish tez orada!', 'info')"><i class="fab fa-google"></i></button>
            </div>

            <button class="switch-btn" onclick="showRegister()">Ro'yxatdan o'tish →</button>
        </div>

        <!-- ==========================================
        AUTH: REGISTER
        ========================================== -->
        <div class="auth-page hidden" id="registerPage">
            <div class="logo">📝</div>
            <div class="title">Ro'yxatdan o'tish</div>
            <div class="subtitle">Bonuslar va chegirmalardan foydalaning</div>

            <div class="input-group">
                <label>Ism</label>
                <input type="text" id="regName" placeholder="Ismingiz" autocomplete="name">
            </div>
            <div class="input-group">
                <label>Telefon</label>
                <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" autocomplete="tel">
            </div>
            <div class="input-group">
                <label>Parol</label>
                <input type="password" id="regPassword" placeholder="Parol" autocomplete="new-password">
            </div>

            <button class="btn btn-primary" onclick="handleRegister()">Ro'yxatdan o'tish</button>

            <button class="switch-btn" onclick="showLogin()">← Kirish</button>
        </div>

        <!-- ==========================================
        MAIN APP
        ========================================== -->
        <div id="mainApp">

            <!-- Profile Header -->
            <div class="profile-header">
                <div class="avatar" id="profileAvatar">👤</div>
                <div class="name" id="profileName">Mehmon</div>
                <div class="phone" id="profilePhone">Telefon qo'shilmagan</div>
            </div>

            <!-- Stats -->
            <div class="profile-stats">
                <div class="stat">
                    <div class="value" id="statOrders">0</div>
                    <div class="label">Buyurtma</div>
                </div>
                <div class="stat">
                    <div class="value" id="statBonus">0</div>
                    <div class="label">Bonus</div>
                </div>
                <div class="stat">
                    <div class="value" id="statSpent">0</div>
                    <div class="label">Sarflangan</div>
                </div>
            </div>

            <!-- Pages -->
            <div class="page active" id="page-home">
                <div class="section-title">🍽 Bugungi taomlar</div>
                <div class="menu-grid" id="menuGrid"></div>
            </div>

            <div class="page" id="page-orders">
                <div class="section-title">📋 Buyurtmalarim</div>
                <div id="ordersList"></div>
            </div>

            <div class="page" id="page-profile">
                <div class="section-title">👤 Profil</div>
                <button class="btn btn-danger" onclick="logout()" style="margin-top:8px;">Chiqish</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
    CART FLOAT
    ========================================== -->
    <div class="cart-float" id="cartFloat">
        <div class="left">
            <div class="count" id="cartCount">0</div>
            <div>
                <div style="font-size:11px;opacity:0.5;">Savat</div>
                <div class="total" id="cartTotal">0 so'm</div>
            </div>
        </div>
        <button class="checkout-btn" onclick="openCheckout()">Buyurtma</button>
    </div>

    <!-- ==========================================
    CHECKOUT SHEET
    ========================================== -->
    <div class="sheet-overlay" id="checkoutSheet">
        <div class="sheet">
            <div class="handle"></div>
            <div class="header">
                <div class="title">🛒 Savat</div>
                <button class="close" onclick="closeSheet()"><i class="fas fa-xmark"></i></button>
            </div>
            <div id="cartItemsList"></div>
            <div class="cart-total">
                Jami: <span id="checkoutTotal">0 so'm</span>
            </div>
            <div class="form-group">
                <label>📞 Telefon</label>
                <input type="tel" id="checkoutPhone" placeholder="+998 90 123 45 67">
            </div>
            <div class="form-group">
                <label>📍 Manzil</label>
                <textarea id="checkoutAddress" rows="2" placeholder="To'liq manzilni kiriting"></textarea>
            </div>
            <div class="form-group">
                <label>💳 To'lov usuli</label>
                <select id="checkoutPayment">
                    <option value="cash">💵 Naqd pul</option>
                    <option value="click">💳 Click</option>
                    <option value="payme">💳 Payme</option>
                </select>
            </div>
            <button class="btn-checkout" onclick="placeOrder()">✅ Buyurtmani rasmiylashtirish</button>
        </div>
    </div>

    <!-- ==========================================
    TAB BAR
    ========================================== -->
    <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">
            <span class="icon"><i class="fas fa-home"></i></span>
            <span>Bosh</span>
        </button>
        <button class="tab-btn" data-tab="orders" onclick="switchTab('orders')">
            <span class="icon"><i class="fas fa-receipt"></i></span>
            <span>Buyurtmalar</span>
        </button>
        <button class="tab-btn" data-tab="profile" onclick="switchTab('profile')">
            <span class="icon"><i class="fas fa-user"></i></span>
            <span>Profil</span>
        </button>
    </div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        // ============================================
        // TELEGRAM
        // ============================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            tg.setHeaderColor('#FFFFFF');
            tg.setBackgroundColor('#F8F9FA');
        }

        // ============================================
        // DATA
        // ============================================
        let usersDB = JSON.parse(localStorage.getItem('usersDB') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        let cart = {};
        let currentTab = 'home';

        const menuData = [
            { id: 1, name: "Osh", price: 35000, emoji: "🍚", category: "Milliy" },
            { id: 2, name: "Shashlik", price: 18000, emoji: "🍢", category: "Milliy" },
            { id: 3, name: "Burger", price: 32000, emoji: "🍔", category: "Fast Food" },
            { id: 4, name: "Pizza", price: 45000, emoji: "🍕", category: "Fast Food" },
            { id: 5, name: "Manti", price: 8000, emoji: "🥟", category: "Milliy" },
            { id: 6, name: "Lavash", price: 28000, emoji: "🌯", category: "Fast Food" },
            { id: 7, name: "Lag'mon", price: 28000, emoji: "🍜", category: "Milliy" },
            { id: 8, name: "Coffee", price: 15000, emoji: "☕", category: "Ichimlik" },
            { id: 9, name: "Cola", price: 12000, emoji: "🥤", category: "Ichimlik" },
            { id: 10, name: "Tort", price: 25000, emoji: "🍰", category: "Desert" },
            { id: 11, name: "Moroz", price: 10000, emoji: "🍦", category: "Desert" },
            { id: 12, name: "Smuzi", price: 18000, emoji: "🥤", category: "Ichimlik" },
        ];

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================
        // AUTH
        // ============================================
        function showLogin() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('tabBar').classList.remove('active');
        }

        function showRegister() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('tabBar').classList.remove('active');
        }

        function showMainApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
            document.getElementById('tabBar').classList.add('active');
            renderMenu();
            updateProfile();
            switchTab('home');
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !phone || !password) {
                showToast('Barcha maydonlarni to\'ldiring!', 'error');
                return;
            }

            // Telefon raqam formatini tekshirish
            const phoneRegex = /^\+?998[0-9]{9}$/;
            if (!phoneRegex.test(phone.replace(/\s/g, ''))) {
                showToast('Telefon raqamni to\'g\'ri kiriting! (+998901234567)', 'error');
                return;
            }

            if (usersDB.find(u => u.phone === phone)) {
                showToast('Bu raqam allaqachon ro\'yxatdan o\'tgan!', 'error');
                return;
            }

            const user = {
                name,
                phone,
                password,
                orders: [],
                bonus: 5000,
                spent: 0,
                registeredAt: new Date().toISOString()
            };

            usersDB.push(user);
            localStorage.setItem('usersDB', JSON.stringify(usersDB));

            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));

            if (tg?.sendData) {
                tg.sendData(JSON.stringify({ action: 'register', name, phone }));
            }

            showToast('✅ Ro\'yxatdan o\'tdingiz! Sizga 5000 bonus berildi!', 'success');
            showMainApp();
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const phone = document.getElementById('loginPhone').value.trim();

            if (!name || !phone) {
                showToast('Ism va telefon raqamni kiriting!', 'error');
                return;
            }

            const user = usersDB.find(u => u.phone === phone && u.name === name);
            if (!user) {
                showToast('Foydalanuvchi topilmadi! Ro\'yxatdan o\'ting.', 'error');
                return;
            }

            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));

            if (tg?.sendData) {
                tg.sendData(JSON.stringify({ action: 'login', phone }));
            }

            showToast('✅ Xush kelibsiz, ' + name + '!', 'success');
            showMainApp();
        }

        function loginWithTelegram() {
            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                const name = u.first_name || 'Mehmon';
                const phone = u.username || 'tg_' + u.id;

                let user = usersDB.find(u => u.phone === phone);
                if (!user) {
                    user = {
                        name,
                        phone,
                        password: 'telegram',
                        orders: [],
                        bonus: 5000,
                        spent: 0,
                        registeredAt: new Date().toISOString()
                    };
                    usersDB.push(user);
                    localStorage.setItem('usersDB', JSON.stringify(usersDB));
                }

                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                showToast('✅ Telegram orqali kirdingiz!', 'success');
                showMainApp();
            } else {
                showToast('Telegram orqali kirish faqat bot ichida ishlaydi', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('tabBar').classList.remove('active');
            document.getElementById('cartFloat').classList.remove('show');
            document.getElementById('mainApp').classList.remove('active');
            showLogin();
            showToast('👋 Siz chiqdingiz!', 'info');
        }

        // ============================================
        // MENU
        // ============================================
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = menuData.map(item => `
                <div class="menu-item" onclick="addToCart(${item.id})">
                    <span class="emoji">${item.emoji}</span>
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price.toLocaleString()} so'm</div>
                </div>
            `).join('');
        }

        // ============================================
        // CART
        // ============================================
        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            if (!item) return;
            if (cart[id]) cart[id].qty++;
            else cart[id] = { ...item, qty: 1 };
            updateCart();
            showToast(`${item.emoji} ${item.name} savatga qo'shildi!`, 'success');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function updateCart() {
            const items = Object.values(cart);
            const count = items.reduce((s, i) => s + i.qty, 0);
            const total = items.reduce((s, i) => s + i.price * i.qty, 0);

            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartTotal').textContent = total.toLocaleString() + " so'm";
            document.getElementById('cartFloat').classList.toggle('show', count > 0);
        }

        function openCheckout() {
            const items = Object.values(cart);
            if (!items.length) {
                showToast('Savat bo\'sh!', 'error');
                return;
            }

            document.getElementById('checkoutPhone').value = currentUser?.phone || '';
            document.getElementById('checkoutAddress').value = '';

            const list = document.getElementById('cartItemsList');
            list.innerHTML = items.map(item => `
                <div class="cart-item-row">
                    <div class="info">
                        <span class="emoji">${item.emoji}</span>
                        <span class="name">${item.name} x${item.qty}</span>
                    </div>
                    <span>${(item.price * item.qty).toLocaleString()} so'm</span>
                </div>
            `).join('');

            const total = items.reduce((s, i) => s + i.price * i.qty, 0);
            document.getElementById('checkoutTotal').textContent = total.toLocaleString() + " so'm";

            document.getElementById('checkoutSheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('checkoutSheet').classList.remove('active');
        }

        function placeOrder() {
            const phone = document.getElementById('checkoutPhone').value.trim();
            const address = document.getElementById('checkoutAddress').value.trim();

            if (!phone || !address) {
                showToast('Telefon va manzilni kiriting!', 'error');
                return;
            }

            const items = Object.values(cart);
            const total = items.reduce((s, i) => s + i.price * i.qty, 0);
            const orderId = Math.floor(Math.random() * 9000) + 1000;

            const order = {
                id: orderId,
                items: items.map(i => `${i.name} x${i.qty}`).join(', '),
                total: total,
                status: 'new',
                date: new Date().toLocaleString('uz-UZ'),
                payment: document.getElementById('checkoutPayment').value
            };

            if (currentUser) {
                if (!currentUser.orders) currentUser.orders = [];
                currentUser.orders.push(order);
                currentUser.bonus = (currentUser.bonus || 0) + Math.floor(total * 0.05);
                currentUser.spent = (currentUser.spent || 0) + total;

                // Update in DB
                const userIndex = usersDB.findIndex(u => u.phone === currentUser.phone);
                if (userIndex !== -1) {
                    usersDB[userIndex] = currentUser;
                    localStorage.setItem('usersDB', JSON.stringify(usersDB));
                }
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
            }

            if (tg?.sendData) {
                tg.sendData(JSON.stringify({
                    action: 'new_order',
                    orderId: orderId,
                    total: total,
                    items: order.items,
                    phone: phone,
                    address: address
                }));
            }

            cart = {};
            updateCart();
            closeSheet();
            updateProfile();
            showToast(`✅ Buyurtma #${orderId} qabul qilindi!`, 'success');
        }

        // ============================================
        // TABS
        // ============================================
        function switchTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(`page-${tab}`);
            if (target) target.classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tab);
            });

            if (tab === 'orders') renderOrders();
            if (tab === 'profile') updateProfile();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // ============================================
        // ORDERS
        // ============================================
        function renderOrders() {
            const container = document.getElementById('ordersList');
            const orders = currentUser?.orders || [];

            if (!orders.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <div class="title">Hali buyurtmalar yo'q</div>
                        <div>Birinchi buyurtmangizni bering!</div>
                    </div>
                `;
                return;
            }

            const statusMap = {
                'new': { text: 'Yangi', class: 'status-new' },
                'delivering': { text: 'Yo\'lda', class: 'status-delivering' },
                'delivered': { text: 'Yetkazildi', class: 'status-delivered' }
            };

            container.innerHTML = orders.slice().reverse().map(order => {
                const st = statusMap[order.status] || statusMap['new'];
                return `
                    <div class="order-card">
                        <div class="top">
                            <span class="order-id">#${order.id}</span>
                            <span class="status ${st.class}">${st.text}</span>
                        </div>
                        <div class="items">${order.items}</div>
                        <div class="bottom">
                            <span class="total">${order.total.toLocaleString()} so'm</span>
                            <span class="date">${order.date || ''}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // PROFILE
        // ============================================
        function updateProfile() {
            if (!currentUser) return;

            document.getElementById('profileName').textContent = currentUser.name || 'Mehmon';
            document.getElementById('profilePhone').textContent = currentUser.phone || 'Telefon qo\'shilmagan';
            document.getElementById('statOrders').textContent = (currentUser.orders || []).length;
            document.getElementById('statBonus').textContent = currentUser.bonus || 0;
            document.getElementById('statSpent').textContent = (currentUser.spent || 0).toLocaleString() + ' so\'m';

            // Avatar
            const avatar = document.getElementById('profileAvatar');
            avatar.textContent = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : '👤';
        }

        // ============================================
        // INIT
        // ============================================
        // Auto-fill from Telegram
        if (tg?.initDataUnsafe?.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('loginName').value = u.first_name || '';
            document.getElementById('regName').value = u.first_name || '';
        }

        // Check if user is logged in
        if (currentUser) {
            showMainApp();
        } else {
            showLogin();
        }

        // Close sheet on overlay click
        document.querySelectorAll('.sheet-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) closeSheet();
            });
        });

        console.log('🍕 FoodExpress ishga tushdi!');
        console.log('👤 Foydalanuvchilar:', usersDB.length);
        console.log('📦 Menyu:', menuData.length, 'ta taom');
    </script>

</body>
</html>
