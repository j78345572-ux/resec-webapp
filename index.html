<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍕 FoodExpress</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary: #FF5A3A;
            --primary-gradient: linear-gradient(135deg, #FF5A3A, #FF2D00);
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --surface-2: #F1F3F5;
            --text: #1A1A2E;
            --text-2: #4A4A5A;
            --text-3: #8A8A9E;
            --border: #EEEEF4;
            --success: #00C853;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-lg: 24px;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ===== AUTH ===== */
        #authPage {
            display: none;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg);
        }
        #authPage.active { display: flex; }

        .auth-container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .auth-header {
            background: var(--primary-gradient);
            padding: 30px 24px;
            color: white;
            text-align: center;
        }
        .auth-header .logo { font-size: 48px; }
        .auth-header .title {
            font-size: 24px;
            font-weight: 900;
            margin-top: 8px;
        }
        .auth-header .sub {
            font-size: 14px;
            opacity: 0.85;
        }
        .auth-body { padding: 24px; }
        .auth-body .input-group {
            position: relative;
            margin-bottom: 14px;
        }
        .auth-body .input-group .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
        }
        .auth-body .input-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: var(--surface-2);
        }
        .auth-body .input-group input:focus {
            border-color: var(--primary);
        }
        .auth-body .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 90, 58, 0.3);
        }
        .auth-body .btn-primary:active { transform: scale(0.97); }
        .auth-body .switch-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            margin-top: 12px;
            width: 100%;
            text-align: center;
        }

        /* ===== MAIN APP ===== */
        #mainApp { display: none; }
        #mainApp.active { display: block; }

        /* Header */
        .app-header {
            background: var(--surface);
            padding: 16px 20px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .app-header .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .app-header .top .greeting strong {
            font-size: 18px;
            display: block;
        }
        .app-header .top .greeting span {
            font-size: 13px;
            color: var(--text-3);
        }
        .app-header .top .actions {
            display: flex;
            gap: 8px;
        }
        .app-header .top .actions button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--surface-2);
            font-size: 16px;
            cursor: pointer;
            position: relative;
        }
        .app-header .top .actions button .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .app-header .top .actions button .badge.show { display: flex; }

        /* Location */
        .location-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface-2);
            border-radius: var(--radius);
            margin-bottom: 10px;
            cursor: pointer;
        }
        .location-bar .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .location-bar .info { flex: 1; }
        .location-bar .info .label {
            font-size: 11px;
            color: var(--text-3);
            font-weight: 600;
            text-transform: uppercase;
        }
        .location-bar .info .address { font-weight: 700; }

        /* Search */
        .search-wrap {
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: none;
            border-radius: var(--radius);
            background: var(--surface-2);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .search-wrap input:focus {
            box-shadow: 0 0 0 3px rgba(255, 90, 58, 0.15);
        }
        .search-wrap .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
        }

        /* Categories */
        .cat-section {
            padding: 16px 16px 8px;
            background: var(--surface);
        }
        .cat-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px 0 12px;
        }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            min-width: 64px;
            background: var(--surface-2);
            border: 2px solid transparent;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-2);
            font-family: inherit;
            transition: all 0.2s;
        }
        .cat-chip .emoji { font-size: 24px; }
        .cat-chip.active {
            background: var(--primary-gradient);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(255, 90, 58, 0.3);
        }

        /* Menu Grid */
        .section {
            padding: 16px 0;
            background: var(--surface);
            margin-top: 8px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 12px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 900;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px;
        }
        .menu-item {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-item:active { transform: scale(0.96); }
        .menu-item .image {
            height: 120px;
            background: linear-gradient(135deg, #FFF0E8, #FFE0D0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
        }
        .menu-item .body { padding: 12px; }
        .menu-item .body .name { font-weight: 700; font-size: 14px; }
        .menu-item .body .desc {
            font-size: 12px;
            color: var(--text-3);
            margin: 2px 0 6px;
        }
        .menu-item .body .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item .body .price {
            font-weight: 900;
            font-size: 15px;
            color: var(--primary);
        }
        .menu-item .body .add-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        /* Cart Float */
        .cart-float {
            position: fixed;
            bottom: 90px;
            left: 16px;
            right: 16px;
            background: var(--text);
            color: white;
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .cart-float.show { display: flex; }
        .cart-float .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-float .left .count {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
        }
        .cart-float .left .info .total { font-weight: 800; font-size: 16px; }
        .cart-float .right button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 700;
            cursor: pointer;
        }

        /* Pages */
        .page { display: none; padding: 16px; animation: fadeUp 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 16px;
        }

        /* Orders */
        .order-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-card .top .status {
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-new { background: #FFF0E0; color: var(--primary); }
        .status-delivering { background: #E3F2FD; color: #0D47A1; }
        .status-delivered { background: #E8F5E9; color: var(--success); }

        /* Profile */
        .profile-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .profile-card .avatar { font-size: 60px; }
        .profile-card .name { font-size: 20px; font-weight: 900; }
        .profile-card .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 16px;
        }
        .profile-card .stats .stat .value {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
        }
        .profile-card .stats .stat .label {
            font-size: 12px;
            color: var(--text-3);
        }

        /* Checkout Sheet */
        .sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: flex-end;
            backdrop-filter: blur(8px);
        }
        .sheet-overlay.active { display: flex; }
        .sheet {
            background: var(--surface);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px 32px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .sheet .handle {
            width: 40px;
            height: 4px;
            background: var(--surface-3);
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .sheet .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .sheet .header .title { font-size: 22px; font-weight: 900; }
        .sheet .header .close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--surface-2);
            font-size: 18px;
            cursor: pointer;
        }
        .sheet .form-group { margin-bottom: 14px; }
        .sheet .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-3);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .sheet .form-group input,
        .sheet .form-group textarea,
        .sheet .form-group select {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: var(--surface);
        }
        .sheet .form-group input:focus,
        .sheet .form-group textarea:focus {
            border-color: var(--primary);
        }
        .sheet .btn-checkout {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 90, 58, 0.3);
        }

        /* Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: none;
            justify-content: space-around;
            padding: 8px 0 12px;
            border-top: 1px solid var(--border);
            z-index: 999;
        }
        .tab-bar.active { display: flex; }
        .tab-bar .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            background: none;
            border: none;
            color: var(--text-4);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .tab-bar .tab-btn .icon { font-size: 22px; }
        .tab-bar .tab-btn.active { color: var(--primary); }

        @media (max-width: 400px) {
            .menu-grid { gap: 10px; }
            .menu-item .image { height: 100px; font-size: 40px; }
        }
        @media (min-width: 600px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <!-- ===== AUTH PAGE ===== -->
    <div id="authPage" class="active">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo">🍕</div>
                <div class="title">FoodExpress</div>
                <div class="sub">Onlayn restoran yetkazib berish</div>
            </div>
            <div class="auth-body" id="authBody">
                <!-- Login -->
                <div id="loginForm">
                    <div class="input-group">
                        <span class="icon"><i class="fas fa-user"></i></span>
                        <input type="text" placeholder="Ismingiz" id="loginName">
                    </div>
                    <div class="input-group">
                        <span class="icon"><i class="fas fa-phone"></i></span>
                        <input type="tel" placeholder="+998 90 123 45 67" id="loginPhone">
                    </div>
                    <button class="btn-primary" onclick="handleLogin()">Kirish</button>
                    <button class="switch-btn" onclick="showRegister()">Ro'yxatdan o'tish →</button>
                </div>

                <!-- Register -->
                <div id="registerForm" style="display:none;">
                    <div class="input-group">
                        <span class="icon"><i class="fas fa-user"></i></span>
                        <input type="text" placeholder="Ismingiz" id="regName">
                    </div>
                    <div class="input-group">
                        <span class="icon"><i class="fas fa-phone"></i></span>
                        <input type="tel" placeholder="+998 90 123 45 67" id="regPhone">
                    </div>
                    <div class="input-group">
                        <span class="icon"><i class="fas fa-lock"></i></span>
                        <input type="password" placeholder="Parol" id="regPassword">
                    </div>
                    <button class="btn-primary" onclick="handleRegister()">Ro'yxatdan o'tish</button>
                    <button class="switch-btn" onclick="showLogin()">← Kirish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="mainApp">
        <div class="app-header">
            <div class="top">
                <div class="greeting">
                    <strong id="userName">Mehmon</strong>
                    <span>Bugun qanday taom istaysiz?</span>
                </div>
                <div class="actions">
                    <button onclick="showCheckout()">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="badge" id="cartBadge">0</span>
                    </button>
                    <button onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="location-bar" onclick="detectLocation()">
                <div class="icon"><i class="fas fa-location-dot"></i></div>
                <div class="info">
                    <div class="label">Yetkazish manzili</div>
                    <div class="address" id="userAddress">Manzilni tanlang</div>
                </div>
            </div>
            <div class="search-wrap">
                <span class="icon"><i class="fas fa-search"></i></span>
                <input type="text" placeholder="Taom qidirish..." id="searchInput" oninput="searchFoods(this.value)">
            </div>
        </div>

        <div class="cat-section">
            <div class="cat-scroll" id="categories"></div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title" id="gridTitle">🍽 Barcha taomlar</div>
            </div>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- Pages -->
        <div class="page" id="page-orders">
            <div class="page-title">📋 Buyurtmalarim</div>
            <div id="ordersList"></div>
        </div>

        <div class="page" id="page-profile">
            <div class="profile-card">
                <div class="avatar">👤</div>
                <div class="name" id="profileName">Mehmon</div>
                <div class="stats">
                    <div class="stat">
                        <div class="value" id="statOrders">0</div>
                        <div class="label">Buyurtma</div>
                    </div>
                    <div class="stat">
                        <div class="value" id="statSpent">0</div>
                        <div class="label">Sarflangan</div>
                    </div>
                    <div class="stat">
                        <div class="value" id="statBonus">0</div>
                        <div class="label">Bonus</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CART FLOAT ===== -->
    <div class="cart-float" id="cartFloat">
        <div class="left">
            <div class="count" id="floatCount">0</div>
            <div class="info">
                <div style="font-size:11px;opacity:0.5;">Savat</div>
                <div class="total" id="floatTotal">0 so'm</div>
            </div>
        </div>
        <div class="right">
            <button onclick="showCheckout()">Buyurtma</button>
        </div>
    </div>

    <!-- ===== CHECKOUT ===== -->
    <div class="sheet-overlay" id="checkoutSheet">
        <div class="sheet">
            <div class="handle"></div>
            <div class="header">
                <div class="title">🛒 Savat</div>
                <button class="close" onclick="closeSheet('checkoutSheet')"><i class="fas fa-xmark"></i></button>
            </div>
            <div id="cartItemsList"></div>
            <div style="text-align:right;font-weight:900;font-size:18px;padding:12px 0;border-top:2px solid var(--border);">
                Jami: <span style="color:var(--primary);" id="checkoutTotal">0 so'm</span>
            </div>
            <div class="form-group">
                <label>📞 Telefon</label>
                <input type="tel" id="checkoutPhone" placeholder="+998 90 123 45 67">
            </div>
            <div class="form-group">
                <label>📍 Manzil</label>
                <textarea id="checkoutAddress" rows="2" placeholder="To'liq manzil"></textarea>
            </div>
            <div class="form-group">
                <label>💳 To'lov usuli</label>
                <select id="checkoutPayment">
                    <option value="cash">💵 Naqd pul</option>
                    <option value="click">💳 Click</option>
                    <option value="payme">💳 Payme</option>
                </select>
            </div>
            <button class="btn-checkout" onclick="placeOrder()">✅ Buyurtmani rasmiylashtirish</button>
        </div>
    </div>

    <!-- ===== TAB BAR ===== -->
    <nav class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">
            <span class="icon"><i class="fas fa-home"></i></span>
            <span>Bosh</span>
        </button>
        <button class="tab-btn" data-tab="orders" onclick="switchTab('orders')">
            <span class="icon"><i class="fas fa-receipt"></i></span>
            <span>Buyurtmalar</span>
        </button>
        <button class="tab-btn" data-tab="profile" onclick="switchTab('profile')">
            <span class="icon"><i class="fas fa-user"></i></span>
            <span>Profil</span>
        </button>
    </nav>

    <script>
        // ===== TELEGRAM =====
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand();
            tg.ready();
            tg.setHeaderColor('#FFFFFF');
            tg.setBackgroundColor('#F8F9FA'); }

        // ===== USER DATA =====
        let userData = {
            name: '',
            phone: '',
            password: '',
            address: localStorage.getItem('userAddress') || '',
            isLoggedIn: localStorage.getItem('userLoggedIn') === 'true',
            orders: JSON.parse(localStorage.getItem('userOrders') || '[]'),
            bonus: parseInt(localStorage.getItem('userBonus') || '0')
        };

        // ===== USERS DATABASE =====
        let usersDB = JSON.parse(localStorage.getItem('usersDB') || '[]');

        // ===== MENU =====
        const menuData = [
            { id: 1, name: "Osh", price: 35000, emoji: "🍚", category: "Milliy", desc: "Qo'y go'shti, sabzi" },
            { id: 2, name: "Shashlik", price: 18000, emoji: "🍢", category: "Milliy", desc: "Mol go'shti" },
            { id: 3, name: "Burger", price: 32000, emoji: "🍔", category: "Fast Food", desc: "Dabl chizburger" },
            { id: 4, name: "Pizza", price: 45000, emoji: "🍕", category: "Fast Food", desc: "Pepperoni" },
            { id: 5, name: "Manti", price: 8000, emoji: "🥟", category: "Milliy", desc: "Bug'da pishirilgan" },
            { id: 6, name: "Lavash", price: 28000, emoji: "🌯", category: "Fast Food", desc: "Tovuq go'shti" },
            { id: 7, name: "Lag'mon", price: 28000, emoji: "🍜", category: "Milliy", desc: "Qo'y go'shti" },
            { id: 8, name: "Coffee", price: 15000, emoji: "☕", category: "Ichimlik", desc: "Kapuchino" },
            { id: 9, name: "Cola", price: 12000, emoji: "🥤", category: "Ichimlik", desc: "1 litr" },
            { id: 10, name: "Tort", price: 25000, emoji: "🍰", category: "Desert", desc: "Shokoladli" },
            { id: 11, name: "Moroz", price: 10000, emoji: "🍦", category: "Desert", desc: "Muzqaymoq" },
            { id: 12, name: "Smuzi", price: 18000, emoji: "🥤", category: "Ichimlik", desc: "Meva" },
        ];

        let cart = {};
        let currentCategory = "Barcha taomlar";

        // ===== AUTH =====
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !phone || !password) {
                tg?.showAlert ? tg.showAlert('Barcha maydonlarni to\'ldiring!') : alert('Barcha maydonlarni to\'ldiring!');
                return;
            }

            // Check if user exists
            if (usersDB.find(u => u.phone === phone)) {
                tg?.showAlert ? tg.showAlert('Bu raqam allaqachon ro\'yxatdan o\'tgan!') :
                    alert('Bu raqam allaqachon ro\'yxatdan o\'tgan!');
                return;
            }

            // Save user
            usersDB.push({ name, phone, password, orders: [], bonus: 5000 });
            localStorage.setItem('usersDB', JSON.stringify(usersDB));

            userData.name = name;
            userData.phone = phone;
            userData.password = password;
            userData.isLoggedIn = true;
            userData.bonus = 5000;
            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userBonus', '5000');

            showMainApp();
            if (tg?.showAlert) tg.showAlert('✅ Ro\'yxatdan o\'tdingiz! Sizga 5000 bonus berildi!');
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const phone = document.getElementById('loginPhone').value.trim();

            if (!name || !phone) {
                tg?.showAlert ? tg.showAlert('Ism va telefon raqamni kiriting!') : alert('Ism va telefon raqamni kiriting!');
                return;
            }

            // Find user
            const user = usersDB.find(u => u.phone === phone && u.name === name);
            if (!user) {
                tg?.showAlert ? tg.showAlert('Foydalanuvchi topilmadi! Ro\'yxatdan o\'ting.') :
                    alert('Foydalanuvchi topilmadi! Ro\'yxatdan o\'ting.');
                return;
            }

            userData.name = user.name;
            userData.phone = user.phone;
            userData.isLoggedIn = true;
            userData.bonus = user.bonus || 0;
            userData.orders = user.orders || [];
            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userBonus', userData.bonus);
            localStorage.setItem('userOrders', JSON.stringify(userData.orders));

            showMainApp();
            if (tg?.showAlert) tg.showAlert('✅ Xush kelibsiz, ' + name + '!');
        }

        function logout() {
            userData.isLoggedIn = false;
            localStorage.setItem('userLoggedIn', 'false');
            document.getElementById('authPage').classList.add('active');
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('tabBar').classList.remove('active');
            document.getElementById('cartFloat').classList.remove('show');
        }

        // ===== MAIN APP =====
        function showMainApp() {
            document.getElementById('authPage').classList.remove('active');
            document.getElementById('mainApp').classList.add('active');
            document.getElementById('tabBar').classList.add('active');
            document.getElementById('userName').textContent = userData.name;
            if (userData.address) document.getElementById('userAddress').textContent = userData.address;
            renderCategories();
            renderMenu();
            updateProfile();
            updateCart();
            switchTab('home');
        }

        // ===== RENDER =====
        function getCategories() {
            const cats = ['Barcha taomlar', ...new Set(menuData.map(i => i.category))];
            return cats;
        }

        function renderCategories() {
            const cats = getCategories();
            const emojis = { 'Barcha taomlar': '🍽', 'Milliy': '🥘', 'Fast Food': '🍔', 'Ichimlik': '🥤', 'Desert': '🍰' };
            document.getElementById('categories').innerHTML = cats.map(cat =>
                `<button class="cat-chip ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
                    <span class="emoji">${emojis[cat] || '🍽'}</span>
                    <span>${cat}</span>
                </button>`
            ).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            document.getElementById('gridTitle').textContent = cat;
            renderMenu();
        }

        function renderMenu() {
            const items = currentCategory === 'Barcha taomlar' ? menuData : menuData.filter(i => i.category === currentCategory);
            document.getElementById('menuGrid').innerHTML = items.map(item =>
                `<div class="menu-item" onclick="addToCart(${item.id})">
                    <div class="image">${item.emoji}</div>
                    <div class="body">
                        <div class="name">${item.name}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="bottom">
                            <span class="price">${item.price.toLocaleString()} so'm</span>
                            <button class="add-btn" onclick="event.stopPropagation();addToCart(${item.id})"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>`
            ).join('');
        }

        function searchFoods(query) {
            if (!query.trim()) { renderMenu(); return; }
            const filtered = menuData.filter(i =>
                i.name.toLowerCase().includes(query.toLowerCase()) ||
                i.category.toLowerCase().includes(query.toLowerCase())
            );
            document.getElementById('menuGrid').innerHTML = filtered.map(item =>
                `<div class="menu-item" onclick="addToCart(${item.id})">
                    <div class="image">${item.emoji}</div>
                    <div class="body">
                        <div class="name">${item.name}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="bottom">
                            <span class="price">${item.price.toLocaleString()} so'm</span>
                            <button class="add-btn" onclick="event.stopPropagation();addToCart(${item.id})"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>`
            ).join('');
        }

        // ===== CART =====
        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            if (!item) return;
            if (cart[id]) cart[id].qty++;
            else cart[id] = { ...item, qty: 1 };
            updateCart();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function updateCart() {
            const items = Object.values(cart);
            const count = items.reduce((s, i) => s + i.qty, 0);
            const total = items.reduce((s, i) => s + i.price * i.qty, 0);

            document.getElementById('cartBadge').textContent = count;
            document.getElementById('cartBadge').className = 'badge' + (count > 0 ? ' show' : '');
            document.getElementById('floatCount').textContent = count;
            document.getElementById('floatTotal').textContent = total.toLocaleString() + " so'm";
            document.getElementById('cartFloat').className = 'cart-float' + (count > 0 ? ' show' : '');
        }

        // ===== CHECKOUT =====
        function showCheckout() {
            const items = Object.values(cart);
            if (!items.length) {
                tg?.showAlert ? tg.showAlert('Savat bo\'sh!') : alert('Savat bo\'sh!');
                return;
            }

            document.getElementById('checkoutPhone').value = userData.phone;
            document.getElementById('checkoutAddress').value = userData.address;

            document.getElementById('cartItemsList').innerHTML = items.map(item =>
                `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
                    <span>${item.emoji} ${item.name} x${item.qty}</span>
                    <span>${(item.price * item.qty).toLocaleString()} so'm</span>
                </div>`
            ).join('');

            const total = items.reduce((s, i) => s + i.price * i.qty, 0);
            document.getElementById('checkoutTotal').textContent = total.toLocaleString() + " so'm";
            document.getElementById('checkoutSheet').classList.add('active');
        }

        function closeSheet(id) {
            document.getElementById(id).classList.remove('active');
        }

        function placeOrder() {
            const phone = document.getElementById('checkoutPhone').value.trim();
            const address = document.getElementById('checkoutAddress').value.trim();

            if (!phone || !address) {
                tg?.showAlert ? tg.showAlert('Telefon va manzilni kiriting!') : alert('Telefon va manzilni kiriting!');
                return;
            }

            const items = Object.values(cart);
            const total = items.reduce((s, i) => s + i.price * i.qty, 0);
            const orderId = Math.floor(Math.random() * 9000) + 1000;

            const order = {
                orderId,
                items: items.map(i => `${i.name} x${i.qty}`).join(', '),
                total,
                status: 'new',
                date: new Date().toLocaleString('uz-UZ')
            };

            userData.orders.push(order);
            userData.bonus += Math.floor(total * 0.05);
            localStorage.setItem('userOrders', JSON.stringify(userData.orders));
            localStorage.setItem('userBonus', userData.bonus);

            // Update user in DB
            const user = usersDB.find(u => u.phone === userData.phone);
            if (user) {
                user.orders = userData.orders;
                user.bonus = userData.bonus;
                localStorage.setItem('usersDB', JSON.stringify(usersDB));
            }

            if (tg?.sendData) {
                tg.sendData(JSON.stringify({
                    action: 'new_order',
                    orderId,
                    total,
                    items: order.items,
                    phone,
                    address
                }));
            }

            cart = {};
            updateCart();
            updateProfile();
            closeSheet('checkoutSheet');
            if (tg?.showAlert) tg.showAlert(`✅ Buyurtma #${orderId} qabul qilindi!`);
        }

        // ===== TABS =====
        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(`page-${tabId}`);
            if (target) target.classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });

            if (tabId === 'orders') renderOrders();
            if (tabId === 'profile') updateProfile();
            if (tabId === 'home') {
                document.getElementById('page-home').classList.add('active');
                document.getElementById('searchInput').value = '';
                renderMenu();
            }
        }

        // ===== ORDERS =====
        function renderOrders() {
            const container = document.getElementById('ordersList');
            if (!userData.orders.length) {
                container.innerHTML =
                    `<div style="text-align:center;padding:60px 20px;color:var(--text-3);">
                        <div style="font-size:60px;">📭</div>
                        <div style="font-weight:700;font-size:18px;color:var(--text);">Hali buyurtmalar yo'q</div>
                    </div>`;
                return;
            }

            const statusMap = {
                'new': { text: 'Yangi', class: 'status-new' },
                'delivering': { text: 'Yo\'lda', class: 'status-delivering' },
                'delivered': { text: 'Yetkazildi', class: 'status-delivered' }
            };

            container.innerHTML = userData.orders.slice().reverse().map(order => {
                const st = statusMap[order.status] || statusMap['new'];
                return `<div class="order-card">
                    <div class="top">
                        <span>#${order.orderId}</span>
                        <span class="status ${st.class}">${st.text}</span>
                    </div>
                    <div style="margin:8px 0;">${order.items}</div>
                    <div style="display:flex;justify-content:space-between;">
                        <span style="font-weight:900;">${order.total.toLocaleString()} so'm</span>
                        <span style="font-size:12px;color:var(--text-3);">${order.date || ''}</span>
                    </div>
                </div>`;
            }).join('');
        }

        // ===== PROFILE =====
        function updateProfile() {
            document.getElementById('profileName').textContent = userData.name || 'Mehmon';
            document.getElementById('statOrders').textContent = userData.orders.length;
            const spent = userData.orders.reduce((s, o) => s + (o.total || 0), 0);
            document.getElementById('statSpent').textContent = spent > 0 ? (spent / 1000).toFixed(1) + 'k' : '0';
            document.getElementById('statBonus').textContent = userData.bonus;
        }

        // ===== LOCATION =====
        function detectLocation() {
            if (!navigator.geolocation) {
                tg?.showAlert ? tg.showAlert('Brauzer geolokatsiyani qo\'llab-quvvatlamaydi') :
                    alert('Brauzer geolokatsiyani qo\'llab-quvvatlamaydi');
                return;
            }
            const addrEl = document.getElementById('userAddress');
            addrEl.textContent = 'Aniqlanmoqda...';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const addr = `📍 ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                    userData.address = addr;
                    localStorage.setItem('userAddress', addr);
                    addrEl.textContent = addr;
                },
                () => { addrEl.textContent = 'Manzilni tanlang'; },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ===== INIT =====
        if (userData.isLoggedIn) {
            showMainApp();
        } else {
            document.getElementById('authPage').classList.add('active');
        }

        // Auto-fill from Telegram
        if (tg?.initDataUnsafe?.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('loginName').value = u.first_name || '';
            document.getElementById('regName').value = u.first_name || '';
        }

        console.log('🍕 FoodExpress ishga tushdi!');
    </script>
</body>
</html>
