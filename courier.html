<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚕 Kuryer Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #FF5A3A;
            --primary-gradient: linear-gradient(135deg, #FF5A3A, #FF2D00);
            --bg: #F1F3F5;
            --surface: #FFFFFF;
            --surface-2: #F8F9FA;
            --text: #1A1A2E;
            --text-2: #4A4A5A;
            --text-3: #8A8A9E;
            --border: #EEEEF4;
            --success: #00C853;
            --danger: #FF1744;
            --warning: #FFB300;
            --shadow: 0 8px 30px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.1);
            --radius: 14px;
            --radius-lg: 20px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* ===== AUTH ===== */
        #authPage { display: none; min-height: 100vh; justify-content: center; align-items: center; padding: 20px; background: var(--bg); }
        #authPage.active { display: flex; }
        .auth-container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .auth-header {
            background: var(--primary-gradient);
            padding: 32px 24px;
            color: white;
            text-align: center;
        }
        .auth-header .logo { font-size: 48px; }
        .auth-header .title { font-size: 24px; font-weight: 900; margin-top: 4px; }
        .auth-header .sub { font-size: 14px; opacity: 0.85; }
        .auth-body { padding: 24px; }
        .auth-body .input-group {
            position: relative;
            margin-bottom: 14px;
        }
        .auth-body .input-group .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
        }
        .auth-body .input-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: var(--surface-2);
            transition: all 0.2s;
        }
        .auth-body .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 90, 58, 0.08);
        }
        .auth-body .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 90, 58, 0.3);
            transition: all 0.2s;
        }
        .auth-body .btn-primary:active { transform: scale(0.97); }

        /* ===== MAIN ===== */
        #mainApp { display: none; }
        #mainApp.active { display: block; }

        /* ===== HEADER ===== */
        .header {
            background: var(--surface);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header .logo { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .header .logo span { color: var(--primary); }
        .header .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-online { background: #E8F5E9; color: var(--success); }
        .status-offline { background: #FFEBEE; color: var(--danger); }
        .header .actions { display: flex; gap: 8px; align-items: center; }
        .header .actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 16px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .stat-card .value { font-size: 22px; font-weight: 900; color: var(--primary); }
        .stat-card .label { font-size: 11px; color: var(--text-3); font-weight: 600; }

        /* ===== LOCATION BUTTON ===== */
        .location-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            margin: 0 16px 16px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
            width: calc(100% - 32px);
        }
        .location-btn:active { transform: scale(0.97); }
        .location-btn.active { border-color: var(--success); background: #E8F5E9; }
        .location-btn i { font-size: 18px; }

        /* ===== ORDERS ===== */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            padding: 0 16px;
            margin-bottom: 10px;
        }
        .order-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin: 0 16px 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .order-card .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-card .top .id { font-weight: 700; font-size: 15px; }
        .order-card .top .status {
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-new { background: #FFF0E0; color: var(--primary); }
        .status-delivering { background: #E3F2FD; color: #0D47A1; }
        .status-delivered { background: #E8F5E9; color: var(--success); }
        .order-card .items { margin: 8px 0; font-size: 14px; color: var(--text-2); }
        .order-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 4px;
        }
        .order-card .bottom .total { font-weight: 800; }
        .order-card .bottom .address { font-size: 12px; color: var(--text-3); }
        .order-card .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .order-card .actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .order-card .actions button:active { transform: scale(0.95); }
        .btn-accept { background: var(--success); color: white; }
        .btn-deliver { background: var(--primary-gradient); color: white; }
        .btn-decline { background: #FFEBEE; color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
        }
        .empty-state .icon { font-size: 56px; margin-bottom: 8px; }
        .empty-state .title {
            font-weight: 700;
            font-size: 17px;
            color: var(--text);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: var(--radius);
            color: white;
            font-weight: 700;
            font-size: 14px;
            z-index: 9999;
            display: none;
            animation: slideDown 0.3s ease;
            max-width: calc(100% - 40px);
            text-align: center;
        }
        .toast.show { display: block; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--text); }
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .order-card .top { flex-direction: column; align-items: flex-start; }
            .order-card .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== AUTH PAGE ===== -->
    <div id="authPage" class="active">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo">🚕</div>
                <div class="title">Kuryer Panel</div>
                <div class="sub">Yetkazib berish xizmati</div>
            </div>
            <div class="auth-body">
                <div class="input-group">
                    <span class="icon"><i class="fas fa-user"></i></span>
                    <input type="text" id="courierLogin" placeholder="Login" autocomplete="username">
                </div>
                <div class="input-group">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="courierPassword" placeholder="Parol" autocomplete="current-password">
                </div>
                <button class="btn-primary" onclick="courierLogin()">Kirish</button>
                <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-3);">
                    Demo: courier1 / 123456
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="mainApp">
        <!-- Header -->
        <div class="header">
            <div class="logo">🚕 <span>Kuryer</span></div>
            <div class="actions">
                <span class="status-badge status-offline" id="statusBadge">🔴 Offline</span>
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="statToday">0</div>
                <div class="label">📦 Bugun</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statTotal">0</div>
                <div class="label">📋 Jami</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statRating">0</div>
                <div class="label">⭐ Reyting</div>
            </div>
        </div>

        <!-- Location Toggle -->
        <button class="location-btn" id="locationBtn" onclick="toggleLocation()">
            <i class="fas fa-location-dot"></i>
            <span id="locationText">Holatni yoqish</span>
        </button>

        <!-- My Orders -->
        <div class="section-title">📋 Mening buyurtmalarim</div>
        <div id="myOrdersList"></div>

        <!-- Available Orders -->
        <div class="section-title" style="margin-top:12px;">🆕 Yangi buyurtmalar</div>
        <div id="availableOrdersList"></div>
    </div>

    <script>
        // ===== TELEGRAM =====
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor('#F1F3F5'); }

        // ===== DATA =====
        let courierData = {
            isLoggedIn: localStorage.getItem('courierLoggedIn') === 'true',
            id: parseInt(localStorage.getItem('courierId') || '0'),
            name: localStorage.getItem('courierName') || '',
            login: localStorage.getItem('courierLogin') || '',
            status: localStorage.getItem('courierStatus') || 'offline'
        };

        let watchId = null;

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // ===== AUTH =====
        function courierLogin() {
            const login = document.getElementById('courierLogin').value.trim();
            const pass = document.getElementById('courierPassword').value.trim();
            
            const couriers = JSON.parse(localStorage.getItem('couriers') || '[]');
            const courier = couriers.find(c => c.login === login && c.password === pass);
            
            if (!courier) {
                showToast('❌ Noto\'g\'ri login yoki parol!', 'error');
                return;
            }
            
            courierData.isLoggedIn = true;
            courierData.id = courier.id;
            courierData.name = courier.name;
            courierData.login = courier.login;
            courierData.status = courier.status || 'offline';
            
            localStorage.setItem('courierLoggedIn', 'true');
            localStorage.setItem('courierId', courier.id);
            localStorage.setItem('courierName', courier.name);
            localStorage.setItem('courierLogin', courier.login);
            localStorage.setItem('courierStatus', courierData.status);
            
            showToast('✅ Xush kelibsiz, ' + courier.name + '!', 'success');
            showMainApp();
        }

        function logout() {
            courierData.isLoggedIn = false;
            localStorage.removeItem('courierLoggedIn');
            localStorage.removeItem('courierId');
            localStorage.removeItem('courierName');
            localStorage.removeItem('courierLogin');
            localStorage.removeItem('courierStatus');
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            document.getElementById('authPage').classList.add('active');
            document.getElementById('mainApp').classList.remove('active');
            showToast('👋 Siz chiqdingiz!', 'info');
        }

        // ===== MAIN APP =====
        function showMainApp() {
            document.getElementById('authPage').classList.remove('active');
            document.getElementById('mainApp').classList.add('active');
            updateStatus();
            renderOrders();
            updateStats();
            if (courierData.status === 'online') {
                startLocationTracking();
            }
        }

        // ===== STATUS =====
        function updateStatus() {
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('locationBtn');
            const text = document.getElementById('locationText');
            
            if (courierData.status === 'online') {
                badge.textContent = '🟢 Online';
                badge.className = 'status-badge status-online';
                btn.classList.add('active');
                text.textContent = '📍 Holat: Online';
                btn.style.borderColor = 'var(--success)';
            } else {
                badge.textContent = '🔴 Offline';
                badge.className = 'status-badge status-offline';
                btn.classList.remove('active');
                text.textContent = '📴 Holat: Offline';
                btn.style.borderColor = 'var(--border)';
            }
        }

        function toggleLocation() {
            if (courierData.status === 'online') {
                courierData.status = 'offline';
                localStorage.setItem('courierStatus', 'offline');
                if (watchId) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                // Update courier in localStorage
                updateCourierInDB(courierData.id, 'offline');
                showToast('📴 Holat offline qilindi', 'info');
            } else {
                if (!navigator.geolocation) {
                    showToast('❌ Brauzer geolokatsiyani qo\'llab-quvvatlamaydi', 'error');
                    return;
                }
                courierData.status = 'online';
                localStorage.setItem('courierStatus', 'online');
                startLocationTracking();
                updateCourierInDB(courierData.id, 'online');
                showToast('🟢 Holat online qilindi', 'success');
            }
            updateStatus();
        }

        function updateCourierInDB(courierId, status) {
            let couriers = JSON.parse(localStorage.getItem('couriers') || '[]');
            const courier = couriers.find(c => c.id === courierId);
            if (courier) {
                courier.status = status;
                if (status === 'online') {
                    courier.last_location_update = new Date().toISOString();
                }
                localStorage.setItem('couriers', JSON.stringify(couriers));
            }
        }

        // ===== LOCATION TRACKING =====
        function startLocationTracking() {
            if (watchId) { navigator.geolocation.clearWatch(watchId); }
            
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    
                    // Update in localStorage
                    let couriers = JSON.parse(localStorage.getItem('couriers') || '[]');
                    const courier = couriers.find(c => c.id === courierData.id);
                    if (courier) {
                        courier.latitude = lat;
                        courier.longitude = lng;
                        courier.last_location_update = new Date().toISOString();
                        localStorage.setItem('couriers', JSON.stringify(couriers));
                    }
                    
                    // Send to Telegram
                    if (tg?.sendData) {
                        tg.sendData(JSON.stringify({
                            action: 'courier_location',
                            courier_id: courierData.id,
                            lat: lat,
                            lng: lng
                        }));
                    }
                    
                    document.getElementById('locationText').textContent = `📍 Online (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                },
                (err) => {
                    console.error('GPS xatolik:', err);
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                }
            );
        }

        // ===== ORDERS =====
        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const myOrders = orders.filter(o => o.courier_id === courierData.id && o.status !== 'delivered');
            const availableOrders = orders.filter(o => o.status === 'new' && !o.courier_id);
            
            // My Orders
            const myContainer = document.getElementById('myOrdersList');
            if (!myOrders.length) {
                myContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <div class="title">Hali buyurtmalar yo'q</div>
                        <div style="font-size:14px;color:var(--text-3);">Sizga tayinlangan buyurtmalar</div>
                    </div>
                `;
            } else {
                myContainer.innerHTML = myOrders.map(o => buildOrderCard(o, true)).join('');
            }
            
            // Available Orders
            const availContainer = document.getElementById('availableOrdersList');
            if (!availableOrders.length) {
                availContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">✅</div>
                        <div class="title">Barcha buyurtmalar qabul qilingan</div>
                        <div style="font-size:14px;color:var(--text-3);">Yangi buyurtma kutilmoqda</div>
                    </div>
                `;
            } else {
                availContainer.innerHTML = availableOrders.map(o => buildOrderCard(o, false)).join('');
            }
        }

        function buildOrderCard(order, isMyOrder) {
            const statusMap = { 'new': 'Yangi', 'delivering': 'Yo\'lda', 'delivered': 'Yetkazildi' };
            const statusClass = { 'new': 'status-new', 'delivering': 'status-delivering', 'delivered': 'status-delivered' };
            
            return `
                <div class="order-card">
                    <div class="top">
                        <span class="id">#${order.id}</span>
                        <span class="status ${statusClass[order.status] || 'status-new'}">${statusMap[order.status] || order.status}</span>
                    </div>
                    <div class="items">${order.items}</div>
                    <div class="bottom">
                        <span class="total">${order.total_price.toLocaleString()} so'm</span>
                        <span class="address">📍 ${order.address}</span>
                    </div>
                    <div class="bottom">
                        <span style="font-size:12px;color:var(--text-3);">👤 ${order.user_name || order.user}</span>
                        <span style="font-size:12px;color:var(--text-3);">📞 ${order.phone}</span>
                    </div>
                    ${!isMyOrder ? `
                        <div class="actions">
                            <button class="btn-accept" onclick="acceptOrder(${order.id})"><i class="fas fa-check"></i> Qabul qilish</button>
                            <button class="btn-decline" onclick="declineOrder(${order.id})"><i class="fas fa-times"></i> Rad etish</button>
                        </div>
                    ` : `
                        ${order.status === 'delivering' ? `
                            <div class="actions">
                                <button class="btn-deliver" onclick="deliverOrder(${order.id})"><i class="fas fa-check-circle"></i> Yetkazildi</button>
                            </div>
                        ` : ''}
                    `}
                </div>
            `;
        }

        // ===== ACCEPT ORDER =====
        function acceptOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'delivering';
                order.courier_id = courierData.id;
                localStorage.setItem('orders', JSON.stringify(orders));
                
                showToast(`✅ Buyurtma #${orderId} qabul qilindi!`, 'success');
                
                if (tg?.sendData) {
                    tg.sendData(JSON.stringify({
                        action: 'order_accepted',
                        order_id: orderId,
                        courier_name: courierData.name
                    }));
                }
                
                renderOrders();
                updateStats();
            }
        }

        // ===== DECLINE ORDER =====
        function declineOrder(orderId) {
            if (!confirm(`Buyurtma #${orderId} ni rad etasizmi?`)) return;
            showToast(`❌ Buyurtma #${orderId} rad etildi`, 'info');
            renderOrders();
        }

        // ===== DELIVER ORDER =====
        function deliverOrder(orderId) {
            if (!confirm(`Buyurtma #${orderId} yetkazildi deb belgilaysizmi?`)) return;
            
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'delivered';
                order.delivered_at = new Date().toISOString();
                localStorage.setItem('orders', JSON.stringify(orders));
                
                // Update courier stats
                let couriers = JSON.parse(localStorage.getItem('couriers') || '[]');
                const courier = couriers.find(c => c.id === courierData.id);
                if (courier) {
                    courier.total_deliveries = (courier.total_deliveries || 0) + 1;
                    localStorage.setItem('couriers', JSON.stringify(couriers));
                }
                
                showToast(`✅ Buyurtma #${orderId} yetkazildi!`, 'success');
                
                if (tg?.sendData) {
                    tg.sendData(JSON.stringify({
                        action: 'order_delivered',
                        order_id: orderId
                    }));
                }
                
                renderOrders();
                updateStats();
            }
        }

        // ===== STATS =====
        function updateStats() {
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const myOrders = orders.filter(o => o.courier_id === courierData.id);
            const today = myOrders.filter(o => {
                const date = new Date(o.delivered_at || o.created_at);
                const today = new Date();
                return date.getDate() === today.getDate() && 
                       date.getMonth() === today.getMonth() && 
                       date.getFullYear() === today.getFullYear() &&
                       o.status === 'delivered';
            });
            
            document.getElementById('statToday').textContent = today.length;
            document.getElementById('statTotal').textContent = myOrders.filter(o => o.status === 'delivered').length;
            
            // Rating
            const couriers = JSON.parse(localStorage.getItem('couriers') || '[]');
            const courier = couriers.find(c => c.id === courierData.id);
            document.getElementById('statRating').textContent = courier?.rating?.toFixed(1) || '4.8';
        }

        // ===== INIT =====
        if (courierData.isLoggedIn) {
            showMainApp();
        } else {
            document.getElementById('authPage').classList.add('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'courierLogin' || active.id === 'courierPassword') {
                    courierLogin();
                }
            }
        });

        console.log('🚕 Kuryer Panel ishga tushdi!');
        console.log('Demo kuryerlar: courier1 / 123456, courier2 / 123456, courier3 / 123456');
    </script>

</body>
</html>
